<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알파카어 번역소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F3EADD;
    --panel: #FBF6EE;
    --ink: #2E2117;
    --ink-soft: #6B5B4B;
    --brick: #B24E39;
    --teal: #2F6B66;
    --mustard: #D9A441;
    --border: #E1D0AF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, sans-serif;
  }

  body {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(46,33,23,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  /* ---------- Panel (shared by encode/decode) ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 26px;
    box-shadow: 0 2px 0 var(--border);
  }

  .panel + .panel { margin-top: 20px; }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .panel-title {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .panel-title.encode { color: var(--brick); }
  .panel-title.decode { color: var(--teal); }

  .direction {
    font-size: 13px;
    color: var(--ink-soft);
  }

  label.field-label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }

  textarea {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    padding: 12px 14px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    font-family: 'Pretendard', sans-serif;
    outline: none;
    transition: border-color .15s ease;
  }

  textarea:focus { border-color: var(--ink-soft); }

  .encode textarea.output,
  .decode textarea.input-alpaca {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  .output-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 6px;
  }

  .copy-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }

  .copy-btn:hover { background: var(--ink); color: #fff; }

  .output-box {
    background: #fff;
    border: 1px dashed var(--border);
  }

  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  .error-text { color: var(--brick); }

  /* ---------- Center hero (site name) ---------- */
  .hero {
    text-align: center;
    padding: 28px 0 44px;
  }

  .hero-mark {
    font-size: 26px;
    display: block;
    margin-top: 10px;
  }

  .hero-title {
    font-weight: 900;
    font-size: clamp(40px, 9vw, 64px);
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0;
    color: var(--ink);
  }

  .hero-title .stroke {
    display: inline-block;
    position: relative;
  }

  .hero-title .stroke::after {
    content: "";
    position: absolute;
    left: 2%;
    right: 2%;
    bottom: -6px;
    height: 10px;
    background: var(--mustard);
    opacity: .55;
    border-radius: 6px;
    z-index: -1;
  }

  .hero-sub {
    margin: 16px auto 0;
    max-width: 420px;
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .divider-word {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.02em;
    margin: 6px 0 0;
  }

  .divider-word::before,
  .divider-word::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- HERO / SITE NAME -->
  <div class="hero">
    <span class="hero-mark">🦙</span>
    <h1 class="hero-title"><span class="stroke">알파카어</span> 번역소</h1>
    <p class="hero-sub">사람의 언어와 알파카의 언어를 3비트 단위로 주고받는 아주 작은 번역기예요.</p>
  </div>

  <!-- ENCODE PANEL -->
  <section class="panel encode">
    <div class="panel-head">
      <span class="panel-title encode">사람의 말 → 알파카어</span>
      <span class="direction">encode</span>
    </div>

    <label class="field-label" for="encode-input">번역할 문장을 입력하세요</label>
    <textarea id="encode-input" placeholder="예: 안녕 알파카"></textarea>

    <div class="output-row">
      <label class="field-label" style="margin:0;">알파카어 번역 결과</label>
      <button class="copy-btn" data-copy="encode-output">복사</button>
    </div>
    <textarea id="encode-output" class="output output-box" readonly placeholder="여기에 알파카어가 나타나요"></textarea>
  </section>

  <!-- DECODE PANEL -->
  <section class="panel decode">
    <div class="panel-head">
      <span class="panel-title decode">알파카어 → 사람의 말</span>
      <span class="direction">decode</span>
    </div>

    <label class="field-label" for="decode-input">알파카어 문장을 입력하세요</label>
    <textarea id="decode-input" class="input-alpaca" placeholder="예: cuutte..."></textarea>

    <div class="output-row">
      <label class="field-label" style="margin:0;">사람의 말 번역 결과</label>
      <button class="copy-btn" data-copy="decode-output">복사</button>
    </div>
    <textarea id="decode-output" class="output-box" readonly placeholder="여기에 번역된 말이 나타나요"></textarea>
  </section>

</div>

<script>
  const TABLE = ['cu','ut','te','al','lp','pa','ac','ca'];

  function encodeAlpaca(str) {
    let buff = '';
    const output = [];

    for (const c of str) {
      const cp = c.codePointAt(0);
      let temp = cp.toString(2);
      temp = '0'.repeat(21 - temp.length) + temp;
      buff += temp;

      while (buff.length >= 3) {
        output.push(TABLE[parseInt(buff.slice(0, 3), 2)]);
        buff = buff.slice(3);
      }
    }

    if (buff.length) {
      while (buff.length < 3) buff += '0';
      output.push(TABLE[parseInt(buff, 2)]);
    }

    return output.join('');
  }

  function decodeAlpaca(str) {
    const cleaned = str.replace(/\s+/g, '');
    let B = '';

    for (let i = 0; i < cleaned.length; i += 2) {
      const word = cleaned.slice(i, i + 2);
      if (word.length < 2) break;
      const idx = TABLE.indexOf(word);
      if (idx === -1) {
        throw new Error(`"${word}"는 알 수 없는 알파카어예요`);
      }
      let temp = idx.toString(2);
      while (temp.length < 3) temp = '0' + temp;
      B += temp;
    }

    let result = '';
    let p = 0;
    while (p + 21 <= B.length) {
      result += String.fromCodePoint(parseInt(B.slice(p, p + 21), 2));
      p += 21;
    }
    return result;
  }

  const encodeInput = document.getElementById('encode-input');
  const encodeOutput = document.getElementById('encode-output');
  const decodeInput = document.getElementById('decode-input');
  const decodeOutput = document.getElementById('decode-output');

  encodeInput.addEventListener('input', () => {
    encodeOutput.value = encodeAlpaca(encodeInput.value);
  });

  decodeInput.addEventListener('input', () => {
    try {
      decodeOutput.value = decodeAlpaca(decodeInput.value);
      decodeOutput.classList.remove('error-text');
    } catch (e) {
      decodeOutput.value = e.message;
      decodeOutput.classList.add('error-text');
    }
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.copy);
      if (!target.value) return;
      navigator.clipboard.writeText(target.value).then(() => {
        const original = btn.textContent;
        btn.textContent = '복사됨!';
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    });
  });
</script>

</body>
</html>
